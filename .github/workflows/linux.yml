name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: apt-get update && apt-get install -y libsqlite3-dev pkg-config
      - name: Test SmartWardKit
        working-directory: Packages/SmartWardKit
        run: swift test
