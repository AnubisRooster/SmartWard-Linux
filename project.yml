name: SmartWard
options:
  bundleIdPrefix: com.intelligentdesignsllc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  SmartWardKit:
    path: Packages/SmartWardKit
  OnDeviceKit:
    path: Packages/OnDeviceKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  SmartWard:
    type: application
    platform: iOS
    # iPhone 15 Pro and newer (Apple Intelligence-capable) — see docs/PLAN.md D3.
    deploymentTarget: "26.0"
    sources:
      - path: SmartWard
        excludes:
          - Info.plist
          - SmartWard.entitlements
    dependencies:
      - target: SmartWardShare
      - package: SmartWardKit
        product: KnowledgeStore
      - package: SmartWardKit
        product: StrategistCore
      - package: SmartWardKit
        product: IngestKit
      - package: SmartWardKit
        product: AppLock
      - package: SmartWardKit
        product: Pipeline
      - package: SmartWardKit
        product: ShareInbox
      - package: OnDeviceKit
        product: BYOKLLMKit
      - package: OnDeviceKit
        product: ModelCatalogKit
      - package: OnDeviceKit
        product: PINLockKit
      - package: OnDeviceKit
        product: BiometricLockKit
      - package: OnDeviceKit
        product: VoiceLoopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intelligentdesignsllc.smartward
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Background task identifiers and modes; merged with the generated keys.
        INFOPLIST_FILE: SmartWard/Info.plist
        # App Group shared with the share extension.
        CODE_SIGN_ENTITLEMENTS: SmartWard/SmartWard.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: SmartWard
        INFOPLIST_KEY_NSFaceIDUsageDescription: "SmartWard uses Face ID to unlock your research and conversations."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SmartWard uses the microphone so you can talk to the strategist instead of typing, and, if you turn on voice navigation, control the app by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "SmartWard transcribes what you say, on-device when possible, so you can talk to the strategist instead of typing. Voice navigation always transcribes on-device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  # Share extension (PLAN FR-3): writes shared links and text to the App
  # Group inbox; the app imports them. Links only the dependency-free
  # ShareInbox module.
  SmartWardShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - SmartWardShare.entitlements
    dependencies:
      - package: SmartWardKit
        product: ShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intelligentdesignsllc.smartward.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SmartWard
        CODE_SIGN_ENTITLEMENTS: ShareExtension/SmartWardShare.entitlements
        SKIP_INSTALL: YES
